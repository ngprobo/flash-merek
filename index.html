<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flash Merek — Flash Merek — Web</title>
<style>
:root{--bg:#F7F8FA;--sf:#FFF;--side:#F2F3F5;--bd:#E1E4E8;--soft:#EEF0F3;--tx:#0F141A;--sub:#5A6472;--mu:#8A93A0;--pri:#1F4FB8;--pri2:#2459C4;--sel:#D6E2F0;--navy:#1E2B55;--ok:#16794C;--okbg:#E6F4EC;--wn:#A15C00;--wnbg:#FFF4E0;--er:#B42318;--erbg:#FDECEA;--gold:#F5C242}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Amazon Ember",-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:#DDE1E6;display:flex;justify-content:center;min-height:100vh;color:var(--tx)}

.h2{font-size:21px;font-weight:700;margin:2px 0 4px;line-height:1.25}.p{color:var(--sub);font-size:14px;line-height:1.45}
.sec{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn:disabled{background:#B8C4DA;cursor:not-allowed}.btn.gh{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px}
.ft{position:absolute;bottom:0;left:0;right:0;padding:12px 18px 22px;background:linear-gradient(transparent,var(--bg) 30%)}
label.l{font-size:13px;font-weight:600;display:block;margin:12px 0 6px}label.l i{color:var(--er);font-style:normal}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:15px;background:var(--sf)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);border-color:transparent}
.hint{font-size:12px;color:var(--mu);margin-top:5px}
.opt{border:1.5px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;background:var(--sf);display:flex;gap:10px;align-items:flex-start}
.opt.on{border-color:var(--pri);background:#F3F7FD}.opt b{font-size:14px}.opt small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.prog{height:4px;background:var(--soft)}.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
.tabsr{display:flex;gap:6px;overflow-x:auto;padding:8px 18px;background:var(--sf);border-bottom:1px solid var(--bd);scrollbar-width:none}
.tabsr span{flex:none;font-size:11px;padding:5px 9px;border-radius:99px;background:var(--soft);color:var(--sub);cursor:pointer}
.tabsr span.on{background:var(--pri);color:#fff}.tabsr span.dn{background:var(--okbg);color:var(--ok)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px}
.ok{background:var(--okbg);color:var(--ok)}.wn{background:var(--wnbg);color:var(--wn)}.er{background:var(--erbg);color:var(--er)}.in{background:var(--sel);color:var(--pri)}
.row{display:flex;align-items:center;gap:10px}.gr{flex:1}
.tb{position:absolute;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;padding:8px 0 18px}
.tb button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);cursor:pointer}.tb button.on{color:var(--pri);font-weight:600}.tb span{display:block;font-size:20px}
.it{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--sf);cursor:pointer}
.num{width:28px;height:28px;flex:none;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.num.d{background:var(--ok);color:#fff}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:16px}
.tl>div{position:relative;padding-bottom:14px}.tl>div:before{content:"";position:absolute;left:-23px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--bd)}
.tl .d:before{background:var(--ok)}.tl .c:before{background:var(--pri);box-shadow:0 0 0 4px var(--sel)}.tl .x:before{background:var(--er)}
.lgg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lgi{aspect-ratio:1;border:1.5px solid var(--bd);border-radius:12px;display:grid;place-items:center;cursor:pointer;background:#fff}
.lgi.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--sel)}
.chip{display:inline-block;padding:7px 11px;border:1px solid var(--bd);border-radius:99px;font-size:13px;margin:0 6px 6px 0;cursor:pointer;background:#fff}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--soft)}.kv span:first-child{color:var(--sub)}.kv span:last-child{text-align:right}
.toast{position:absolute;top:60px;left:18px;right:18px;background:var(--tx);color:#fff;padding:12px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.s{opacity:1}
.sheet{position:absolute;inset:0;background:rgba(15,20,26,.45);display:none;align-items:flex-end;z-index:8}.sheet.s{display:flex}
.sheet>div{background:var(--sf);width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:85%;overflow:auto}
.hero{background:linear-gradient(160deg,var(--navy),var(--pri));color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}
.svc{display:flex;gap:12px;padding:14px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);margin-bottom:10px;cursor:pointer}
.svc .ic{width:42px;height:42px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:20px}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:10px auto}

.cb .bx{width:20px;height:20px;flex:none;border:1.5px solid var(--bd);border-radius:5px;display:grid;place-items:center;font-size:13px;color:#fff}.cb .bx.on{background:var(--pri);border-color:var(--pri)}
.bill{background:var(--navy);color:#fff;border-radius:12px;padding:16px;text-align:center}
.bill .code{font-size:24px;font-weight:800;letter-spacing:2px;margin:8px 0;color:var(--gold)}


/* ================= WEB LAYOUT (≥1000px) ================= */
body.web{display:block;background:var(--bg)}
.phone.web{width:100%;height:100vh;margin:0;border-radius:0;box-shadow:none;display:block;overflow:hidden}
.web .wapp{display:flex;height:100vh}

.web .wnav:hover{background:#E7EAEE}.web .wnav.on{background:var(--sel);font-weight:600}

.web .wmain{flex:1;display:flex;flex-direction:column;min-width:0}

.web .wtop h1{font-size:17px;font-weight:600;flex:1}
.web .wsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--sub);width:260px;background:var(--sf)}
.web .wbody{flex:1;overflow:auto;padding:32px}
.web .wpage{max-width:1240px;margin:0 auto}
.web .wh1{font-size:30px;font-weight:700;margin-bottom:4px}
.web .wsub{color:var(--sub);font-size:15px;margin-bottom:24px}
.web .btn{width:auto;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;font-size:14px;border-radius:8px}
.web .btn.blk{display:flex;width:100%;justify-content:center}
.web .card{padding:20px;border-radius:12px}
.web .g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.web .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.web .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.web .kpi b{font-size:28px;display:block;margin-top:6px}.web .kpi span{font-size:13px;color:var(--sub)}
.web .sheet{align-items:center;justify-content:center}.web .sheet>div{max-width:560px;border-radius:16px;padding:24px}
.web .toast{left:auto;right:32px;top:80px;width:360px}
/* wizard */
.web .wz{display:grid;grid-template-columns:220px 1fr 320px;gap:24px;align-items:start}
.web .wstep{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--sub)}
.web .wstep .num{width:24px;height:24px;font-size:12px}
.web .wstep.on{background:var(--sel);color:var(--tx);font-weight:600}.web .wstep.on .num{background:var(--pri);color:#fff}
.web .wform .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.web .wform .fgrid>*{grid-column:1/-1}.web .wform .fgrid>.fld{grid-column:auto}
.web .wform .opt{display:inline-flex;width:calc(50% - 6px);margin-right:8px;vertical-align:top}
.web .wform .opt:nth-of-type(2n){margin-right:0}
.web .wfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--bd);margin-top:24px;padding-top:16px}
.web .sticky{position:sticky;top:0}
/* landing */
.web .lnav{height:72px;display:flex;align-items:center;gap:28px;padding:0 48px;background:var(--sf);border-bottom:1px solid var(--bd)}
.web .lnav a{font-size:14px;color:var(--tx);cursor:pointer}
.web .lwrap{max-width:1200px;margin:0 auto;padding:0 48px}
.web .lhero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;padding:64px 0 48px}
.web .lhero h2{font-size:58px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.web .lhero p{font-size:18px;color:var(--sub);line-height:1.5;margin:20px 0 28px;max-width:520px}
.web .scorecard{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(31,79,184,.12)}
.web .bigring{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;margin:16px auto}
.web .bigring b{width:164px;height:164px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-size:52px;font-weight:800}
.web .band{background:var(--navy);color:#fff;border-radius:20px;padding:40px;display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center;margin:20px 0}
.web .band .lgi{background:#fff}

/* ===== LANDING: jelas jasa apa ===== */
function land(){return '<div class="sc" style="padding-bottom:40px"><div class="row" style="margin:6px 0 14px"><div class="lg0">⚡</div><b style="font-size:17px">Flash Merek</b><span class="gr"></span><a style="font-size:12px;color:var(--pri);cursor:pointer" onclick="'+act(function(){S.role='kons';S.ob=1;go('ob')})+'">Konsultan KI · Masuk</a></div>'+

'<div class="card" style="padding:18px"><div class="sec" style="margin:0 0 6px">② Cek kelas merek (SKM)</div><b style="font-size:15px">Produk Anda masuk kelas berapa?</b><p class="p" style="font-size:13px;margin:4px 0 12px">Cari uraian baku dari Sistem Klasifikasi Merek DJKI.</p><div class="row"><input id="lq" class="gr" placeholder="mis. kopi, batik, keripik"><button class="btn sm" onclick="'+act(function(){skmSheet(gv('lq'))})+'">Cari</button></div></div>'+
pricing()+'</div>'}
function pricing(){return '<div class="sec">Paket harga</div><div class="card" style="border:2px solid var(--pri);position:relative;margin-top:14px"><span class="pill" style="position:absolute;top:-10px;left:14px;background:var(--pri);color:#fff">Paket Umum · All-in</span><div style="font-size:13px;color:var(--sub);margin-top:6px">Nama merek is all you need — logo kami buatkan in-app.</div><div style="font-size:30px;font-weight:800;margin:8px 0 2px">Rp4.799.000</div><div style="font-size:12px;color:var(--mu)">per merek · 1 kelas · sudah termasuk PNBP</div><div style="margin:12px 0;font-size:13px;line-height:1.9">'+['🎨 Logo Studio + etiket siap-DJKI','🧭 Asesmen & pencarian kelas (SKM)','🔎 Cek kemiripan PDKI','📝 Pengisian 9 tab DJKI oleh Konsultan KI','✍️ Surat Kuasa & tanda tangan digital','📍 Tracking sampai sertifikat'].map(function(x){return '<div>'+x+'</div>'}).join('')+'</div><button class="btn" onclick="'+act(function(){S.asm={i:0,a:[]};go('asm')})+'">Cek kesiapan dulu</button></div>'}

{q:'Apakah nama merek sudah dicek di PDKI DJKI?',o:[['Sudah, tidak ada yang mirip',2],['Belum dicek',0],['Ada yang mirip di kelas lain',1]],tip:'Cek di pdki-indonesia.dgip.go.id. Kemiripan pada kelas yang sama = risiko ditolak.'},
